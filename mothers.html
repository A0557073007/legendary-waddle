<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أمهات المؤمنين | ALMAGHANI</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f8f3e8;color:#173b27}
.hero{padding:28px 18px 22px;text-align:center;background:linear-gradient(145deg,#0b4b31,#17623f);color:#fff;border-bottom:4px solid #d4a62b}
.brand{font-family:Georgia,serif;font-size:clamp(40px,10vw,82px);letter-spacing:2px;margin:4px 0}.tag{color:#f4d47a;font-size:18px}.domain{display:inline-block;margin:14px auto 0;padding:9px 30px;background:#fff;color:#173b27;border:2px solid #d4a62b;border-radius:30px}
.wrap{max-width:980px;margin:auto;padding:22px 16px 38px}.intro{text-align:center;font-size:22px;margin:4px 0 22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border:2px solid #d8b65a;border-radius:24px;overflow:hidden;box-shadow:0 10px 28px #173b2718;display:flex;flex-direction:column}

.btn,.back{display:inline-block;text-decoration:none;background:#0d5a38;color:white;border:2px solid #d4a62b;padding:11px 28px;border-radius:30px;font-weight:bold;box-shadow:0 5px 12px #0002}.btn:active,.back:active{transform:scale(.98)}
footer{text-align:center;background:#0d4f34;color:#fff;padding:22px;border-top:3px solid #d4a62b}
.page{min-height:100vh;background:#f8f3e8}.topbar{position:sticky;top:0;z-index:10;background:#0d4f34;padding:10px;text-align:center;border-bottom:2px solid #d4a62b}.pageimg{display:block;width:min(100%,1000px);height:auto;margin:0 auto;background:white}.bottom{text-align:center;padding:20px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:16px 10px}.hero{padding-top:20px}.content h2{font-size:22px}}
</style></head>
